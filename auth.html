<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hustleakp - Selamat Datang</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <!-- Container utama ala layar HP -->
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col justify-between p-8 text-slate-800 min-h-[700px] relative">
        
        <!-- Bagian Atas: Status Bar -->
        <div class="flex justify-between items-center text-xs text-slate-400">
            <span>|||</span>
        </div>

        <!-- Bagian Logo & Teks Selamat Datang -->
        <div class="flex flex-col items-center text-center my-auto">
            <!-- Icon / Logo Tameng -->
            <!-- Contoh di bagian logo auth.html -->
        <div class="flex flex-col items-center text-center my-auto">
            <div class="w-20 h-20 mb-4 flex items-center justify-center">
                <img src="logo-Hustleakp.png" alt="Hustleakp Logo" class="w-full h-full object-contain">
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-1">Selamat datang!</h2>
            <p class="text-xs text-slate-400 mb-8">Masuk atau daftar untuk melanjutkan.</p>
        </div>

        <!-- Tombol Aksi (Masuk & Daftar) -->
            <div class="w-full space-y-3">
                <!-- Tombol Masuk mengarah ke Dashboard / Halaman Masuk -->
                <a href="login.html" class="w-full bg-indigo-600 text-white font-semibold py-3.5 rounded-2xl shadow-md hover:bg-indigo-700 transition duration-200 block text-center">
                    Masuk
                </a>
                
                <!-- Tombol Daftar mengarah ke register-1.html -->
                <a href="register1.html" class="w-full bg-white border-2 border-indigo-600 text-indigo-600 font-semibold py-3.5 rounded-2xl hover:bg-indigo-50 transition duration-200 block text-center">
                    Daftar
                </a>
            </div>
        </div>

    </div>

</body>
</html>

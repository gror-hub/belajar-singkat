    <!-- Skrip JavaScript Logout untuk Reset Akun -->
    <script>
        <!-- Skrip JavaScript Logout untuk Reset Akun -->
    function handleLogout() {
        if (confirm("Apakah kamu yakin ingin keluar dari akun ini?")) {
            // Menghapus seluruh data sesi dan profil yang tersimpan di browser
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('hustleakpUser');
            localStorage.removeItem('userName');
            localStorage.removeItem('userHandle');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userBio');
            
            alert('Berhasil keluar! Perangkat siap digunakan akun lain.');
            // Mengarahkan kembali ke halaman login/auth
            window.location.href = 'login.html';
        }
    }
    </script>
</body>

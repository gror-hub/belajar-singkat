<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hustleakp - Onboarding 3</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <!-- Container utama ala layar HP -->
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col justify-between p-8 text-slate-800 min-h-[700px]">
        
        <!-- Bagian Atas: Tombol Lewati / Status Bar -->
        <div class="flex justify-between items-center text-xs text-slate-400">
            <span>9:41</span>
            <a href="auth.html" class="font-medium text-indigo-600 hover:underline">Lewati</a>
        </div>

        <!-- Bagian Ilustrasi & Teks -->
        <div class="flex flex-col items-center text-center my-auto">
            <!-- Ilustrasi Lingkaran Ungu -->
            <div class="w-48 h-48 bg-indigo-50 rounded-full flex items-center justify-center mb-6 relative">
                <!-- Icon hati / dukungan -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
            </div>

            <h2 class="text-xl font-bold text-slate-900 mb-2">Jadilah bagian dari perubahan</h2>
            <p class="text-xs text-slate-500 leading-relaxed px-2">
                Mari ciptakan internet yang lebih positif, aman, dan saling menghargai. Mulai dari diri sendiri.
            </p>
        </div>

        <!-- Bagian Bawah: Indikator Titik & Tombol -->
        <div class="space-y-6">
            <!-- Titik Indikator Slider (Titik 3 aktif) -->
            <div class="flex justify-center space-x-1.5">
                <span class="w-1.5 h-1.5 bg-slate-300 rounded-full"></span>
                <span class="w-1.5 h-1.5 bg-slate-300 rounded-full"></span>
                <span class="w-6 h-1.5 bg-indigo-600 rounded-full"></span>
                <span class="w-1.5 h-1.5 bg-slate-300 rounded-full"></span>
            </div>

            <!-- Tombol Mulai yang mengarah ke halaman Auth / Masuk/Daftar -->
            <a href="auth.html" class="w-full bg-indigo-600 text-white font-semibold py-3.5 rounded-2xl shadow-md hover:bg-indigo-700 transition duration-200 text-center block">
                Mulai
            </a>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hustleakp - Form Lapor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <!-- Container utama ala layar HP -->
    <div class="w-full max-w-sm bg-slate-50 rounded-3xl shadow-2xl overflow-hidden flex flex-col justify-between min-h-[750px] relative text-slate-800">
        
        <!-- Konten Form -->
        <div class="p-6 pb-28 overflow-y-auto">
            
            <!-- Header -->
            <div class="flex items-center mb-4">
                <a href="dasboard.html" class="text-slate-700 hover:text-indigo-600 font-bold text-lg mr-4">&larr;</a>
                <h1 class="text-base font-bold text-slate-900">Form Lapor Cyberbullying</h1>[cite: 7]
            </div>

            <!-- Ikon Shield / Perisai Atas Form -->
            <div class="flex justify-center mb-3">
                <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-600 shadow-sm border border-indigo-100">
                    <span class="text-2xl">🛡️</span>
                </div>
            </div>

            <p class="text-[11px] text-slate-500 text-center mb-5 px-2">
                Laporkan jika kamu mengalami, menyaksikan, atau menjadi korban cyberbullying.
            </p>[cite: 7]

            <!-- Form Inputs -->
            <form onsubmit="handleSubmitReport(event)" class="space-y-4">
                
                <!-- Jenis Laporan -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Jenis laporan</label>
                    <select class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-500 focus:outline-none focus:border-indigo-600">
                        <option value="">Pilih jenis laporan</option>[cite: 7]
                        <option value="pelecehan">Pelecehan Verbal / Kata-kata kasar</option>
                        <option value="penyebaran">Penyebaran Data Pribadi (Doxxing)</option>
                        <option value="ancaman">Ancaman / Intimidasi Online</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                </div>

                <!-- Nama Lengkap (Opsional) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama lengkap (opsional)</label>
                    <input type="text" placeholder="Nama lengkap (opsional)" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:border-indigo-600">[cite: 7]
                </div>

                <!-- Deskripsi Kejadian -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Deskripsi kejadian</label>
                    <textarea rows="3" placeholder="Ceritakan apa yang terjadi..." class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:border-indigo-600 resize-none"></textarea>[cite: 7]
                </div>

                <!-- Unggah Bukti -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Unggah bukti (opsional)</label>[cite: 7]
                    <label class="flex flex-col items-center justify-center w-full h-20 border-2 border-dashed border-slate-200 rounded-xl cursor-pointer bg-white hover:border-indigo-600 transition">
                        <div class="flex items-center space-x-2 text-slate-400 text-xs">
                            <span>📷</span>
                            <span>Pilih file / Foto</span>[cite: 7]
                        </div>
                        <input type="file" class="hidden" accept="image/*,application/pdf">
                    </label>
                    <p class="text-[9px] text-slate-400 mt-1">Format: Jpg, png, pdf (maks. 5MB)</p>[cite: 7]
                </div>

                <!-- Tombol Kirim Laporan -->
                <div class="pt-2">
                    <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-indigo-700 transition text-xs cursor-pointer">
                        Kirim Laporan
                    </button>[cite: 7]
                </div>
            </form>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="absolute bottom-0 left-0 w-full bg-white border-t border-slate-100 py-3 px-6 flex justify-around items-center text-slate-400 text-[10px]">
            <a href="dasboard.html" class="flex flex-col items-center space-y-1 hover:text-indigo-600">
                <span class="text-base">🏠</span>
                <span>Beranda</span>
            </a>
            <a href="artiedu.html" class="flex flex-col items-center space-y-1 hover:text-indigo-600">
                <span class="text-base">📖</span>
                <span>Edukasi</span>
            </a>
            <a href="lapor.html" class="flex flex-col items-center space-y-1 text-indigo-600 font-bold">
                <span class="text-base">🛡️</span>
                <span>Lapor</span>
            </a>
            <a href="account.html" class="flex flex-col items-center space-y-1 hover:text-indigo-600">
                <span class="text-base">👤</span>
                <span>Akun</span>
            </a>
        </div>

    </div>

    <!-- Script sederhana untuk simulasi kirim laporan -->
    <script>
        function handleSubmitReport(event) {
            event.preventDefault();
            alert('Laporan berhasil dikirim secara anonim! Terima kasih telah melapor.');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>

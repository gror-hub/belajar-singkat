<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hustleakp - Masuk Akun</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <!-- Container utama ala layar HP -->
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col justify-between p-8 text-slate-800 min-h-[750px]">
        
        <!-- Bagian Atas: Tombol Kembali & Judul -->
        <div>
            <div class="flex items-center justify-between mb-8">
                <a href="auth.html" class="text-slate-600 hover:text-indigo-600 font-bold">&larr;</a>
                <h1 class="text-sm font-bold text-slate-900">Masuk</h1>
                <div class="w-4"></div>
            </div>

            <div class="mb-6">
                <h2 class="text-xl font-bold text-slate-900 mb-1">Selamat datang kembali!</h2>
                <p class="text-xs text-slate-400 mb-6">Masuk untuk melanjutkan akses ke Hustleakp.</p>
                
                <!-- Form Login -->
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Email atau Nomor HP</label>
                        <input type="text" id="loginEmail" placeholder="Masukkan email / no HP" required class="w-full px-4 py-3 border border-slate-200 rounded-2xl text-xs focus:outline-none focus:border-indigo-600 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Kata Sandi</label>
                        <input type="password" id="loginPassword" placeholder="Masukkan kata sandi" required class="w-full px-4 py-3 border border-slate-200 rounded-2xl text-xs focus:outline-none focus:border-indigo-600 transition">
                    </div>

                    <div class="text-right">
                        <a href="#" onclick="alert('Fitur pemulihan sandi')" class="text-[11px] text-indigo-600 hover:underline">Lupa kata sandi?</a>
                    </div>

                    <!-- Tombol Masuk tipe submit -->
                    <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3.5 rounded-2xl shadow-md hover:bg-indigo-700 transition duration-200 block text-center text-sm cursor-pointer">
                        Masuk Sekarang
                    </button>
                </form>
            </div>
        </div>

    </div>

    <!-- Skrip Simulasi Login -->
    <script>
        function handleLogin(event) {
    event.preventDefault();

    const emailInput = document.getElementById('loginEmail').value.trim();
    const passwordInput = document.getElementById('loginPassword').value;

    if (emailInput && passwordInput) {
        // Ambil daftar semua akun yang pernah terdaftar
        let allUsers = JSON.parse(localStorage.getItem('hustleakp_all_users')) || [];

        // Cari apakah email tersebut ada di database lokal kita
        let foundUser = allUsers.find(u => u.email === emailInput);

        if (foundUser) {
            // Jika akun ditemukan, aktifkan sesi milik akun ini
            localStorage.setItem('currentUserEmail', foundUser.email);
            localStorage.setItem('userName', foundUser.name);
            localStorage.setItem('userHandle', foundUser.handle);
            localStorage.setItem('userEmail', foundUser.email);
            localStorage.setItem('isLoggedIn', 'true');

            alert('Berhasil masuk sebagai ' + foundUser.handle + '!');
            window.location.href = 'dasboard.html';
        } else {
            // Fallback jika datanya belum terekam di array tapi email diisi
            const defaultHandle = emailInput.split('@')[0];
            localStorage.setItem('currentUserEmail', emailInput);
            localStorage.setItem('userName', 'Pengguna Hustleakp');
            localStorage.setItem('userHandle', defaultHandle);
            localStorage.setItem('userEmail', emailInput);
            localStorage.setItem('isLoggedIn', 'true');

            alert('Berhasil masuk!');
            window.location.href = 'dasboard.html';
        }
    } else {
        alert('Mohon isi email dan kata sandi terlebih dahulu.');
    }
}
    </script>

</body>
</html>

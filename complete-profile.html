<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hustleakp - Lengkapi Profil</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <!-- Container utama ala layar HP -->
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col justify-between p-6 text-slate-800 min-h-[750px]">
        
        <!-- Bagian Atas -->
        <div>
            <div class="flex items-center justify-between mb-4">
                <a href="verify-otp.html" class="text-slate-600 hover:text-indigo-600 font-bold">&larr;</a>
                <h1 class="text-sm font-bold text-slate-900">Lengkapi Profil</h1>
                <div class="w-4"></div>
            </div>

            <!-- Indikator Langkah (Step 4 / Profil) -->
            <div class="flex items-center justify-center space-x-2 mb-6">
                <div class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-[10px] font-bold">✓</div>
                <div class="w-4 h-[2px] bg-indigo-600"></div>
                <div class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-[10px] font-bold">✓</div>
                <div class="w-4 h-[2px] bg-indigo-600"></div>
                <div class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-[10px] font-bold">✓</div>
                <div class="w-4 h-[2px] bg-indigo-600"></div>
                <div class="w-6 h-6 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[10px] font-bold">4</div>
            </div>

            <!-- Avatar Upload Placeholder -->
            <div class="flex justify-center mb-6">
                <div class="relative">
                    <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-600 text-2xl">
                        👤
                    </div>
                    <div class="absolute bottom-0 right-0 bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow">
                        📷
                    </div>
                </div>
            </div>

            <!-- Form Input Profil -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama pengguna</label>
                    <!-- Input dengan id="usernameInput" -->
                    <input type="text" id="usernameInput" placeholder="Contoh: syifa_123" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Jenis kelamin</label>
                    <select class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-600 bg-white text-slate-500">
                        <option>Pilih jenis kelamin</option>
                        <option>Laki-laki</option>
                        <option>Perempuan</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Asal sekolah</label>
                    <input type="text" placeholder="Nama sekolah (opsional)" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-600">
                </div>
            </div>
        </div>

        <!-- Tombol Simpan -->
        <div class="pt-4">
            <button onclick="saveProfile()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-indigo-700 transition block text-center text-xs cursor-pointer">
                Simpan
            </button>
        </div>

    </div>

<!-- Skrip JavaScript untuk menyimpan profil dan multi-akun ke localStorage -->
    <script>
        function saveProfile() {
            const username = document.getElementById('usernameInput').value.trim();
            
            // Ambil data sementara dari tahapan registrasi sebelumnya
            const regName = localStorage.getItem('userName') || 'Pengguna Baru';
            const regEmail = localStorage.getItem('userEmail') || 'user@email.com';
            
            // Tentukan username/handle akhir
            const finalUsername = username !== "" ? username : regEmail.split('@')[0];

            // Buat objek data akun lengkap
            const userData = {
                name: regName,
                handle: finalUsername,
                email: regEmail,
                birthdate: localStorage.getItem('userBirthdate') || ''
            };

            // 1. Ambil daftar semua akun yang pernah terdaftar
            let allUsers = JSON.parse(localStorage.getItem('hustleakp_all_users')) || [];
            
            // 2. Cek apakah email sudah terdaftar, jika ada update, jika belum tambahkan baru
            const existingIndex = allUsers.findIndex(u => u.email === regEmail);
            if (existingIndex !== -1) {
                allUsers[existingIndex] = userData;
            } else {
                allUsers.push(userData);
            }
            
            // Simpan kembali database multi-akun
            localStorage.setItem('hustleakp_all_users', JSON.stringify(allUsers));

            // 3. Set sesi akun yang sedang aktif saat ini
            localStorage.setItem('currentUserEmail', regEmail);
            localStorage.setItem('hustleakpUser', finalUsername);
            localStorage.setItem('userHandle', finalUsername);
            localStorage.setItem('isLoggedIn', 'true');

            // Berpindah ke halaman sukses registrasi
            window.location.href = 'success-register.html';
        }
    </script>
</body>
</html>

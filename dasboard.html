<body class="bg-slate-900 flex items-center justify-center min-h-screen">

            <!-- Sapaan Pengguna -->
             <!-- Sapaan Pengguna -->

                <p class="text-xs text-slate-400">Selamat datang di Hustleakp</p>
            </div>

            <!-- Banner Motivasi / Informasi -->
            <div class="bg-indigo-50 border border-indigo-100/60 p-4 rounded-2xl shadow-sm mb-6 flex justify-between items-center">
                <div class="pr-2">
                    <h2 class="text-xs font-bold text-slate-900 mb-1 leading-snug">Yuk, jaga dunia digital yang aman dan positif!</h2>
                    <p class="text-[10px] text-slate-500">Kamu tidak sendirian.</p>
                </div>
                <div class="w-16 h-16 bg-indigo-200/50 rounded-xl flex-shrink-0 flex items-center justify-center text-indigo-700 font-bold text-xs">
                    👧🏻
                </div>
            </div>

            <!-- Grid 4 Menu Utama -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <!-- Menu 1: Edukasi -->
                <a href="edukasi.html" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center hover:border-indigo-200 transition">
                    <div class="w-10 h-10 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600 mb-2">
                        📖
                    </div>
                    <span class="text-xs font-bold text-slate-800">Edukasi</span>
                    <span class="text-[10px] text-slate-400">Cyberbullying</span>
                </a>

                <!-- Menu 2: Lapor -->
                <a href="lapor.html" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center hover:border-indigo-200 transition">
                    <div class="w-10 h-10 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600 mb-2">
                        🛡️
                    </div>
                    <span class="text-xs font-bold text-slate-800">Lapor</span>
                    <span class="text-[10px] text-slate-400">Cyberbullying</span>
                </a>

                <!-- Menu 3: Cerita & Dukungan -->
                <a href="cerita.html" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center hover:border-indigo-200 transition">
                    <div class="w-10 h-10 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600 mb-2">
                        💬
                    </div>
                    <span class="text-xs font-bold text-slate-800">Cerita & Dukungan</span>
                </a>

                <!-- Menu 4: Bantuan Konseling -->
                <a href="konseling.html" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center hover:border-indigo-200 transition">
                    <div class="w-10 h-10 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600 mb-2">

                    </div>
                    <span class="text-xs font-bold text-slate-800">Bantuan Konseling</span>

            </div>
        </div>

        <!-- Bagian Navigasi Bawah (Bottom Navigation) -->
        <div class="border-t border-slate-200 pt-3 flex justify-around text-center text-slate-400 text-[10px]">
            <a href="dasboard.html" 
                class="text-indigo-600 font-semibold flex flex-col items-center">
                <span class="text-sm">🏠</span>
                <span class="mt-0.5">Beranda</span>
            </a>
            <a href="artiedu.html" class="flex flex-col items-center hover:text-indigo-600">
                <span class="text-sm">📖</span>
                <span class="mt-0.5">Edukasi</span>
            </a>
            <a href="lapor.html" class="flex flex-col items-center hover:text-indigo-600">
                <span class="text-sm">🛡️</span>
                <span class="mt-0.5">Laporan</span>
            </a>
            <a href="account.html" 
                class="flex flex-col items-center hover:text-indigo-600">
                <span class="text-sm">👤</span>
                <span class="mt-0.5">Profil</span>
            </a>
        </div>

    </div>
          <script>
    window.addEventListener('DOMContentLoaded', () => {
        const savedUsername = localStorage.getItem('userHandle');
        const savedEmail = localStorage.getItem('userEmail');
        const nameDisplay = document.getElementById('userNameDisplay');
        
        if (nameDisplay) {
            if (savedUsername) {
                // Jika user sudah mengatur handle/nama profil
                nameDisplay.textContent = savedUsername;
            } else if (savedEmail) {
                // Jika belum ada handle, ambil nama dari bagian depan email (sebelum '@')
                const nameFromEmail = savedEmail.split('@')[0];
                // Huruf pertama dibuat kapital agar rapi
                nameDisplay.textContent = nameFromEmail.charAt(0).toUpperCase() + nameFromEmail.slice(1);
            } else {
                nameDisplay.textContent = 'Pengguna';
            }
        }
        });
        </script>
</body>
</html>
